<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow Studio dev</title>
<style>body{margin:0;padding:16px;background:linear-gradient(160deg,#1a1033,#0d0a1f);color:#eee;font-family:Roboto,system-ui,sans-serif}
ha-card{display:block;border-radius:18px;border:1px solid rgba(255,255,255,.08);max-width:520px;margin:auto}</style></head><body>
<glow-studio-card id="c"></glow-studio-card>
<script type="module">
// Mock Home Assistant for clicking around. ?driver=wled|hue|t1 · ?tab=… · ?editor=1 · ?fresh=1
import "../dist/glow-studio-card.js";
import { defaultLibrary } from "../src/defaults.js";
import { pickDriver } from "../src/drivers/index.js";

const params = new URLSearchParams(location.search);
const kind = params.get("driver") || "t1";
const WLED_FX = ["Solid", "Blink", "Breathe", "Wipe", "Rainbow", "Fire 2012", "Candle", "Pacifica", "Aurora", "Twinklefox", "Fireworks", "Plasma", "Colorwaves", "Lake", "Juggle", "Meteor"];
const device = { t1: { name: "Bed Strip", model: "LED Strip T1", model_id: "LGYCDD01LM" },
  wled: { name: "Desk WLED", manufacturer: "WLED" },
  hue: { name: "TV Gradient", model: "Hue Play gradient lightstrip", model_id: "915005987201" } }[kind];
const states = {
  "light.bed_strip": { state: "on", attributes: { brightness: 180, friendly_name: "Bed strip", ...(kind === "wled" ? { effect_list: WLED_FX } : {}) } },
  "number.bed_strip_length": { state: "2" },
};
const hass = {
  states,
  entities: { "light.bed_strip": { entity_id: "light.bed_strip", device_id: "d1" }, "number.bed_strip_length": { entity_id: "number.bed_strip_length", device_id: "d1" } },
  devices: { d1: device },
  callService: async (d, s, data) => {
    console.log(d, s, data);
    if (d === "mqtt" && data.topic.endsWith("/library")) { states["sensor.glow_studio_bed_strip"] = { state: "x", attributes: JSON.parse(data.payload) }; push(); }
    if (d === "light" && s === "toggle") { const l = states["light.bed_strip"]; l.state = l.state === "on" ? "off" : "on"; push(); }
  },
};
const cfg = { entity: "light.bed_strip", ...(kind === "wled" ? { wled_topic: "wled/desk" } : {}) };
const driver = pickDriver(hass, cfg);
const ctx = { hass, cfg, entity: cfg.entity };
if (!params.has("fresh")) states["sensor.glow_studio_bed_strip"] = { state: "1", attributes: defaultLibrary(driver.segments(ctx), driver.defaultEffects(ctx)) };

const c = document.getElementById("c");
function push() { c.hass = { ...hass, states: { ...states } }; }
c.setConfig(cfg); push();
const R = () => c.shadowRoot;
const tab = params.get("tab"); if (tab) setTimeout(() => R().querySelector(`[data-tab="${tab}"]`)?.click(), 50);
if (params.has("editor")) setTimeout(() => { R().querySelector('[data-tab="effects"]').click(); R().querySelector('[data-menu="e0"]').click(); R().querySelector('[data-fx-act="edit"]').click(); }, 80);
</script></body></html>
